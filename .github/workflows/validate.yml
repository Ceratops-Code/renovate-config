name: Renovate configuration

on:
  pull_request:
    paths:
      - org-inherited-config.json
      - .github/workflows/validate.yml
  push:
    branches: [main]
    paths:
      - org-inherited-config.json
      - .github/workflows/validate.yml

permissions:
  contents: read

jobs:
  dependency-configuration:
    name: Dependency configuration
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@2028fbc5c25fe9cf00d9f06a71cc4710d4507903 # v6.0.0
        with:
          node-version: '26.13.0'
      - name: Check inherited Renovate configuration
        run: npm exec --yes --package=renovate@44.240.0 -- renovate-config-validator --strict org-inherited-config.json
